# CI = Continuous Integration: GitHub runs these checks on its own machines
# every time code is pushed, so a broken change is caught before it is merged.
name: CI

on:
  push:
    branches: [main] # after every push to main
  pull_request: #       on every pull request, before it is merged
  workflow_dispatch: #  and by hand: the "Run workflow" button on the Actions page

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no database and no browser.
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (frontend, backend, e2e)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

  # The real app with a real database, tested through its API and in a real browser.
  e2e:
    name: API and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the app
        uses: ./.github/actions/e2e-setup

      - name: API smoke checks
        run: npm run test:api -w backend

      - name: Playwright tests
        working-directory: e2e
        # Screenshots differ between Windows and Linux, so Linux has its own baselines.
        # Until they exist (see visual-baselines.yml), the visual tests are skipped with a warning.
        run: |
          if [ -d tests/visual/__screenshots__/linux ]; then
            npx playwright test
          else
            echo "::warning::Visual tests skipped: no Linux screenshots yet. Run the 'Update visual baselines' workflow once."
            npx playwright test --project=api --project=ui --project=a11y
          fi

      # "if: !cancelled()" = also when tests failed. That is when the report matters most.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            api.log
            web.log
          retention-days: 14
